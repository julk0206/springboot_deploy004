name: Docker

# main branch가 push가 발생하면 자동으로 실행
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1. Maven Build (Jar파일 생성)
      - name: Build with Maven
        run: mvn clean package -DskipTests -f ./deploy004_springboot/pom.xml

      # 2. 다른 아키텍처 (ARM64 등) 빌드를 위한 QEMU(Quick Emulator)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 멀티 플랫폼을 위한 Buildx 설정 추가
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Docker hub에 배포를 위한 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 비륻, 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy004_springboot/Dockerfile
          push: true
          # x86(일반서버)과 ARM64(Mac, 우분투 데스크탑 ARM 등) 지원하도록 설정
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/deploy004_springboot:latest
